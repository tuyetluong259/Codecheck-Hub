name: CI/CD Pipeline with SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-analyze:
    name: Build and Analyze (${{ matrix.service }})
    runs-on: ubuntu-latest

    # Dùng matrix strategy để chạy song song (parallel) các microservices
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - course-service
          - identity-service
          - judge-service
          - notification-service
          - submission-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Bắt buộc fetch-depth=0 để SonarQube phân tích code chính xác (Blame information)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd services/${{ matrix.service }}
          # Lệnh build và đẩy kết quả lên SonarCloud.
          # Lưu ý: Cần đổi "YOUR_ORGANIZATION_KEY" thành organization key thực tế của bạn trên SonarCloud.
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=CodeCheckHub_${{ matrix.service }} \
            -Dsonar.organization=tuyetluong259 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN
